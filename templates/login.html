{% extends "base.html" %}
{% block title %}Login - AgroNexus{% endblock %}
{% block content %}
<style>
    .main { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 64px); background: linear-gradient(135deg, #e8f7ef, #f0f7f3); margin-left: 0 !important; }
    .auth-card { background: #fff; border-radius: 20px; padding: 44px; width: 100%; max-width: 420px; box-shadow: 0 8px 48px rgba(0,0,0,0.10); border: 1px solid #d4e8da; }
    .auth-logo { text-align: center; font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 800; color: #1a5c38; margin-bottom: 6px; }
    .auth-sub { text-align: center; color: #6b8c76; margin-bottom: 32px; font-size: 14px; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13.5px; color: #6b8c76; }
    .auth-footer a { color: #2d9e6b; font-weight: 700; text-decoration: none; }
</style>
<div class="main">
    <div class="auth-card">
        <div class="auth-logo">🌾 AgroNexus</div>
        <div class="auth-sub">Welcome back! Log in to continue</div>
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%; justify-content: center;">Login →</button>
        </form>
        <div class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></div>
    </div>
</div>
{% endblock %}
